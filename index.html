<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta property="og:title" content="@whaeeeeeee" />
    <meta property="og:description" content="A small corner of the internet." />
    <meta property="og:image" content="assets/img/pfp.jpg" />
    <title>@whaeeeeeee</title>
    <link rel="shortcut icon" href="assets/img/pfp.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/themes.css" />
    <script src="https://kit.fontawesome.com/b756c00e57.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-avatar-wrapper">
          <div class="loading-avatar-glow"></div>
          <img id="loading-pfp" src="assets/img/pfp.jpg" alt="whaeeeeeee" />
          <div class="loading-ring"></div>
        </div>
        <div class="loading-progress-container">
          <div class="loading-progress-track"><div class="loading-progress-bar" id="loading-progress-bar"></div></div>
          <div class="loading-text"><span id="loading-status">Preparing your mix...</span><span id="loading-percent">0%</span></div>
        </div>
      </div>
    </div>

    <main>
      <header class="profile-card">
        <div class="profile-orbit"><img id="dc-pfp" src="assets/img/pfp.jpg" alt="whaeeeeeee profile picture" /></div>
        <span class="eyebrow">PERSONAL SPACE / 01</span>
        <h1 id="who">R.</h1>
        <p id="footer">#onthegrind</p>
      </header>

      <section class="mix-card" aria-label="Music mix">
        <div class="section-heading"><span><i class="fa-solid fa-waveform-lines"></i> my mix</span><small id="track-count">x tracks</small></div>
        <div class="now-playing">
          <div class="record-art" id="record-art"><img id="record-art-current" src="assets/img/pfp.jpg" alt="" /><img id="record-art-next" src="assets/img/pfp.jpg" alt="" /></div>
          <div class="track-copy"><span class="eyebrow">NOW PLAYING</span><strong id="track-title">Choose a track</strong><span id="track-artist">the mix is ready</span></div>
          <span id="track-time">0:00</span>
        </div>
        <input type="range" id="seek-bar" value="0" min="0" max="100" step="1" aria-label="Track progress" />
        <div class="mix-controls">
          <button id="prev" aria-label="Previous track"><i class="fa-solid fa-backward-step"></i></button>
          <button id="play-pause" class="primary-control" aria-label="Play mix"><i class="fa-solid fa-play"></i></button>
          <button id="next" aria-label="Next track"><i class="fa-solid fa-forward-step"></i></button>
          <button id="volume-button" aria-label="Toggle volume"><i class="fa-solid fa-volume-high"></i></button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.35" aria-label="Volume" />
        </div>
      </section>

      <section class="friends-section" aria-label="Friends">
        <div class="section-heading"><span><i class="fa-solid fa-sparkles"></i> friends</span><small>the inner circle</small></div>
        <div class="pinned-friend" id="pinned-friend"></div>
        <div class="friends-window" id="friends-scroll-container">
          <div class="friends-track" id="friends-track"></div>
        </div>
      </section>

      <nav class="social-links" aria-label="Social links">
        <a href="https://www.last.fm/user/RoboCookieOff" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-lastfm"></i><span>last.fm</span><small>@RoboCookieOff</small></a>
        <a href="https://www.instagram.com/whaeeeeeee" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i><span>instagram</span><small>@whaeeeeeee</small></a>
        <a href="https://hub.docker.com/u/wxrned404" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-docker"></i><span>docker</span><small>@wxrned404</small></a>
      </nav>
    </main>

    <canvas id="particles-canvas"></canvas>
    <audio id="audio" preload="metadata"></audio>
    <script src="assets/js/loadAssets.js"></script>
    <script src="assets/js/player.js"></script>
    <!-- <script src="assets/js/friends.js"></script> -->
    <script src="assets/js/loading.js"></script>
    <script src="assets/js/particles.js"></script>
  </body>
</html>
